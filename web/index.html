<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c6cf2">
<script>/* apply saved Theme settings before first paint */try{var t=JSON.parse(localStorage.getItem("avos.theme")||"{}"),d=document.documentElement;["theme","accent","side","top","size","density"].forEach(function(k){if(typeof t[k]==="string")d.setAttribute("data-"+k,t[k])})}catch(e){}</script>
<title>AVOS · Autonomous Villa Operating System</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
