# Deploys AVOS to Cloudflare on every push to the working branch, or on demand (Actions → Deploy → Run workflow).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — from Workers & Pages → Overview (right-hand column)
name: Deploy

on:
  push:
    branches: [claude/confident-hamilton-x510u1, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets are visible
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TOKEN_AS_VARIABLE: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_AS_VARIABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "secret CLOUDFLARE_API_TOKEN present:  $HAS_TOKEN"
          echo "secret CLOUDFLARE_ACCOUNT_ID present: $HAS_ACCOUNT"
          if [ "$TOKEN_AS_VARIABLE" = "true" ] || [ "$ACCOUNT_AS_VARIABLE" = "true" ]; then
            echo "::error::Found under Variables, not Secrets. Re-add them on the Secrets tab (Settings → Secrets and variables → Actions → Secrets → New repository secret)."
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it under Repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is not set; Wrangler will try to detect the account from the token (works when the token can see exactly one account)."
          fi

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Build web app
        run: npm run build:web

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ivos --remote --env production

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      # Final test against the live deployment: bindings answer, the API is gated, the web app is served.
      - name: Smoke test the live site
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Testing $URL"
          sleep 5
          health=$(curl -sS --max-time 20 "$URL/api/health?deep=1"); echo "health: $health"
          echo "$health" | grep -q '"ok":true'   || { echo "::error::health not ok"; exit 1; }
          echo "$health" | grep -q '"db":"ok"'   || { echo "::error::D1 binding failed"; exit 1; }
          echo "$health" | grep -q '"r2":"ok"'   || { echo "::error::R2 binding failed"; exit 1; }
          echo "$health" | grep -q '"env":"production"' || { echo "::error::not the production environment"; exit 1; }
          me=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "$URL/api/me"); echo "GET /api/me -> $me"
          [ "$me" = "401" ] || { echo "::error::/api/me should be 401 without a login, got $me"; exit 1; }
          dev=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" -H "x-dev-user: shajianandan@gmail.com" "$URL/api/me"); echo "GET /api/me with dev header -> $dev"
          [ "$dev" = "401" ] || { echo "::error::dev-user header must be ignored in production, got $dev"; exit 1; }
          hook=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" -X POST "$URL/hooks/leads/website?key=wrong" -H 'content-type: application/json' -d '{"name":"probe"}'); echo "POST /hooks/leads/website (bad key) -> $hook"
          [ "$hook" = "401" ] || { echo "::error::hook must reject a bad key with 401, got $hook"; exit 1; }
          title=$(curl -sS --max-time 20 "$URL/" | grep -o '<title>[^<]*</title>'); echo "page: $title"
          echo "$title" | grep -q 'AVOS' || { echo "::error::web app not served"; exit 1; }
          echo "All live checks passed."
