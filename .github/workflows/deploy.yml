# Deploys AVOS to Cloudflare on every push to the working branch, or on demand (Actions → Deploy → Run workflow).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — from Workers & Pages → Overview (right-hand column)
name: Deploy

on:
  push:
    branches: [claude/confident-hamilton-x510u1, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets are visible
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TOKEN_AS_VARIABLE: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_AS_VARIABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "secret CLOUDFLARE_API_TOKEN present:  $HAS_TOKEN"
          echo "secret CLOUDFLARE_ACCOUNT_ID present: $HAS_ACCOUNT"
          if [ "$TOKEN_AS_VARIABLE" = "true" ] || [ "$ACCOUNT_AS_VARIABLE" = "true" ]; then
            echo "::error::Found under Variables, not Secrets. Re-add them on the Secrets tab (Settings → Secrets and variables → Actions → Secrets → New repository secret)."
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it under Repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is not set; Wrangler will try to detect the account from the token (works when the token can see exactly one account)."
          fi

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Build web app
        run: npm run build:web

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ivos --remote --env production

      # Worker secrets come from repository secrets of the same name (Settings → Secrets and variables → Actions):
      #   HOOK_SECRET      — key in the lead-hook URLs and the Meta webhook verify token (any long random string)
      #   META_APP_SECRET  — Meta app → App settings → Basic → App secret
      #   META_PAGE_TOKEN  — long-lived Page access token with leads_retrieval, pages_show_list, pages_manage_metadata
      #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — Google Cloud OAuth web client for the guest-ID archive to Drive
      # Each one present is pushed to the Worker on every deploy; absent ones are left as they are.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in HOOK_SECRET META_APP_SECRET META_PAGE_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            val="${!name}"
            if [ -n "$val" ]; then printf '%s' "$val" | npx wrangler secret put "$name" --env production >/dev/null && echo "$name: set"; else echo "$name: not provided, unchanged"; fi
          done

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      # Final tests. Before Access is switched on, the API answers 401 and the deep health check proves the bindings.
      # Once Access protects the Worker, every address redirects to the team login page, which is what we assert instead.
      - name: Smoke test the deployment (workers.dev)
        run: bash scripts/smoke.sh https://avos.shajianandan.workers.dev kshetrom.cloudflareaccess.com

      - name: Smoke test the custom domain
        run: bash scripts/smoke.sh https://app.shajianandan.com kshetrom.cloudflareaccess.com
